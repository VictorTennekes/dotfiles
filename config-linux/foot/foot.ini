# foot: the main terminal (Super+Return), running as a server that the
# compositor starts through ./reload (windows are `footclient`). Same look as
# ghostty/config.
[main]
include=~/.config/foot/themes/noctalia
font=JetBrainsMono Nerd Font:size=11
pad=5x5 center
selection-target=both

[bell]
system=no

[scrollback]
lines=10000

[cursor]
style=block

[mouse]
hide-when-typing=yes

# Colors come from the Noctalia template (themes/noctalia, included above);
# only the transparency is set here.
[colors-dark]
alpha=0.95
