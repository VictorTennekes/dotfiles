# Launcher (Super+Space), also used as the menu for clipboard and power.
# Raycast/Spotlight style: wide glass bar in the upper third, big search field.
[main]
# Sans for text, Nerd Font as fallback for the icons
font=Noto Sans:size=13,JetBrainsMono Nerd Font:size=13
prompt="󰍉   "
placeholder=Search
terminal=footclient
anchor=top
y-margin=220
width=56
lines=8
horizontal-pad=18
vertical-pad=16
inner-pad=14
line-height=34

[colors]
# Catppuccin Mocha
background=1e1e2eb3
text=cdd6f4ff
prompt=a6adc8ff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
# Selected row: a faint light tint of the glass, not a block
selection=cdd6f41f
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=6c7086ff
border=cba6f799

[border]
width=2
radius=18
selection-radius=10
