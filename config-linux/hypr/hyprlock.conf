# Catppuccin Mocha lock screen
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Time
label {
    monitor =
    text = cmd[update:30000] date +"%-I:%M"
    color = rgb(cdd6f4)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgb(a6adc8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(cba6f7) rgb(fab387) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(fab387)
    placeholder_text = <span foreground="##6c7086">Password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
