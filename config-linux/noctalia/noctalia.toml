# Noctalia: the shell under Umbriel (umbriel/config.toml starts it). This
# is the hand-written layer: theme, templates, widgets, idle, plugins. The
# look (bar, panels, fonts) is being worked out in the Settings GUI for now,
# which saves to ~/.local/state/noctalia/settings.toml; that file loads last
# and wins, so move settled choices into this file. `noctalia config
# validate` checks it (make lint). Reference: https://docs.noctalia.dev/noctalia/

# Palette from the wallpaper, Material tonal-spot: pastel accents on a neutral
# surface, the most minimal of the schemes ("vibrant"/"faithful" tint the
# surfaces with the image instead); widgets use
# palette role names (surface_container, primary, ...) so they follow it.
# Catppuccin stays available as `source = "builtin"`.
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
shell_mode = "follow"
sync_color_scheme = true

# Apps re-themed on every palette change: foot/ghostty themes, Umbriel's
# colour file (umbriel/noctalia.toml), Qt, Claude Code, Neovim. The outputs
# are generated, not committed (.gitignore)
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["umbriel", "qt"]
enable_community_templates = true
community_ids = ["claude-code", "neovim"]

# foot as a user template instead of the built-in one, so the hook can swap
# in a fresh `foot --server` (foot/reload): the built-in only writes the file.
# (Dropping a built-in id runs its undo hook: foot's strips the include line
# from foot.ini, so check that file after toggling it.)
# ghostty as a user template too: the built-in one's hook rewrites the shared
# ghostty config to `theme = noctalia` on every change (the Linux platform
# file already says so); this one only renders the theme and reloads ghostty.
[theme.templates.user.ghostty]
input_path = "/usr/share/noctalia/assets/templates/ghostty/ghostty"
output_path = "$XDG_CONFIG_HOME/ghostty/themes/noctalia"
post_hook = "bash /usr/share/noctalia/assets/templates/ghostty/reload.sh"

[theme.templates.user.foot]
input_path = "/usr/share/noctalia/assets/templates/foot/foot"
output_path = "$XDG_CONFIG_HOME/foot/themes/noctalia"
post_hook = "~/.config/foot/reload"

# Screenshots (Alt+Shift+3/4/5 in the compositor configs): macOS names in
# ~/Screenshots, copied to the clipboard too; the region picker and annotator
# are Noctalia's own, so they follow the palette
[shell.screenshot]
directory = "~/Screenshots"
filename_pattern = "Screenshot %Y-%m-%d at %H.%M.%S"
freeze_screen = true
save_to_file = true
copy_to_clipboard = true

# Launcher, Raycast-style: the search field on top and, until something is
# typed, only the pinned entries (desktop-entry ids; "layout" and "wallpaper"
# are this repo's, home/.local/share/applications). Compact rows, no
# categories or app-origin badges; placement: the default centred float
[shell.launcher]
compact = true
categories = false
show_app_origin_indicator = false
search_position = "top"
default_view = "pinned"
pinned = ["wallpaper", "app.zen_browser.zen", "footclient", "layout"]

[shell.launcher.providers.calculator]
global = true

[shell.launcher.providers.emoji]
global = false

# --- Bar: the widgets only ---
[bar.default]
start = ["workspaces", "btn", "active_window"]
center = ["clock"]
end = ["tray", "tailscale", "network", "bluetooth", "volume", "battery", "power_profile", "notifications", "control-center"]

# All six workspaces shown (Umbriel: six static per output)
[widget.workspaces]
type = "workspaces"
hide_when_empty = false

# Focused workspace's layout (official plugin noctalia/umbriel-companion,
# installed by Noctalia into ~/.local/state/noctalia/plugins): click opens its
# layout/window/workspace panel, a scroll flick cycles the layout. It hides
# itself outside an Umbriel session
[widget.btn]
type = "noctalia/umbriel-companion:bar"
show_layout_name = false

# macOS menu bar style: "Fri 8:24 PM"; full date on hover
[widget.clock]
type = "clock"
format = "{:%a %-I:%M %p}"
vertical_format = "{:%H\n%M}"
tooltip_format = "{:%A, %B %d}"

# Tailscale on/off (plugins/tailscale); click toggles the connection
[widget.tailscale]
type = "victor/tailscale:status"

# Icons only; details live in the tooltips and the control center
[widget.network]
type = "network"
show_label = false

[widget.volume]
type = "volume"
show_label = false

# Percentage next to the icon
[widget.battery]
type = "battery"
show_label = true
label_content = "percent"

[control_center]
hidden_tabs = ["system", "weather", "calendar", "screen-time"]

[system.monitor]
enabled = false

[desktop_widgets]
enabled = false

# Lock screen: a Tiny5 Mono clock up top and a compact, transparent login box
# at the bottom (positions in eDP-1's 1800x1200 logical space). The "if found"
# label with a phone number, and the widget order that includes it, stay in
# the GUI state file (~/.local/state/noctalia/settings.toml): this repo is
# public.
[lockscreen_widgets]
enabled = true
schema_version = 2

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 900.0
cy = 954.0
output = "eDP-1"
placement_height = 1200.0
placement_width = 1800.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.0
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = false
show_weather = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
box_height = 256.0
box_width = 544.0
cx = 896.0
cy = 280.0
output = "eDP-1"
placement_height = 1200.0
placement_width = 1800.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
background = false
background_opacity = 0.0
center_text = true
clock_style = "digital"
font_family = "Tiny5 Mono"
shadow = true

# The picker (Super+Shift+W, or "Wallpaper" in the launcher)
# lists `directory`; the symlink is the fallback until one is picked
[wallpaper]
fill_mode = "crop"
directory = "/home/victor/Pictures/Wallpapers"

[wallpaper.default]
path = "/home/victor/Pictures/Wallpapers/current"

# Idle: fade, lock at 5 min, screen off at 5.5, suspend at 15
[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
timeout = 300

[idle.behavior.screen_off]
action = "screen_off"
timeout = 330
locked_timeout = 30

[idle.behavior.suspend]
action = "suspend"
timeout = 900
lock_before_suspend = true

# Plugins: the two upstream catalogues plus this repo's own (plugins/)
[plugins]
enabled = ["noctalia/umbriel-companion", "victor/tailscale"]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

[[plugins.source]]
name = "dotfiles"
kind = "path"
location = "/home/victor/.config/noctalia/plugins"
enabled = true
