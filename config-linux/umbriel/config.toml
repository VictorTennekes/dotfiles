# Umbriel config (session "Umbriel" in SDDM); the keys follow the macOS-ish
# layout used since niri. `umbriel config validate` checks it (make lint); Umbriel reloads
# it on save, except autostart, xwayland and [environment].
# Reference: https://docs.noctalia.dev/umbriel/

# Noctalia's Umbriel template writes noctalia.toml next to this file with the
# wallpaper palette ([colors] and [colors.border]). Listed here up front so its
# apply hook, which would otherwise append it, never rewrites this file.
[include.optional]
files = ["noctalia.toml"]

# --- Session ---
# Native Wayland wherever an app supports it; X11-only apps (Bitwarden forces
# X11) run through Umbriel's on-demand Xwayland, scaled like everything else.
[general]
autostart = [
  "powerprofilesctl set power-saver",
  "~/.config/foot/reload",
  "/usr/libexec/polkit-mate-authentication-agent-1",
  "noctalia",
]
mod_key = "Super"
xwayland = true
show_cheatsheet = false
focus_on_activate = true

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland;xcb"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
# No accessibility bus (at-spi) for GTK apps; re-enable for a screen reader
GTK_A11Y = "none"
NO_AT_BRIDGE = "1"

# --- Monitor ---
# Built-in 2880x1920 panel: 1.6 gives an 1800x1200 workspace. Six fixed
# workspaces (Super+1..6), always shown in the bar.
[output.eDP-1]
scale = 1.6
workspaces = 6

[workspaces]
back_and_forth = true

# --- Input ---
[input.keyboard]
# Caps Lock -> Escape
options = "caps:escape"
# macOS KeyRepeat=2 (30ms -> ~33/s) and InitialKeyRepeat=15 (225ms)
repeat_delay = 225
repeat_rate = 33
numlock_toggle = false

[input.touchpad]
tap = true
# macOS "natural" scrolling; two-finger click = right click (clickfinger)
natural_scroll = true
click_method = "clickfinger"
scroll_factor = 0.75
disable_while_typing = true

[input.mouse]
natural_scroll = true

# Focus follows the mouse; hovering focuses but never raises
[input.focus]
follows_mouse = true
hover_raises = false

[input.cursor]
size = 24
hide_when_typing = true
hide_timeout_ms = 5000

# --- Layout ---
# Every workspace is a scrolling strip; new windows take 2/3 of the screen and
# Super+R cycles 1/3, 1/2, 2/3. A window alone keeps its width, centered.
[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.667
center_underfull_strip = true
center_focused = "never"

# --- Look ---
# Colours come from noctalia.toml (above). No blur (low power; Noctalia's
# panels draw their own background); no shadows, the 2px border separates
# windows; short animations, none on bars/menus.
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.blur]
enabled = false

# What shows before Noctalia's wallpaper is up (and if the lock screen stalls):
# black, not the palette's grey surface_variant that noctalia.toml sets.
# This file is applied after its includes, so this wins.
[colors]
backdrop = "#000000FF"

[appearance.shadow]
enabled = false

[animation]
enabled = true
duration_ms = 250

[animation.layers]
enabled = false

[hot_corners.top_left]
enabled = false

# --- Window rules ---
# Small utility windows float, centered
[[window_rule]]
match.app_id = "^(xdg-desktop-portal-gtk|com\\.gabm\\.satty|org\\.tui\\.floating)$"
default_floating = true
default_floating_size_px = { width = 900, height = 600 }

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# --- Keys ---
# This table replaces Umbriel's built-in binds entirely. Super+drag moves,
# Super+right-drag resizes and three-finger swipes switch workspaces without
# binds.
[keybinds]
# Apps
"Mod+Return" = { action = "spawn footclient", repeat = false }
"Mod+Shift+Return" = { action = "spawn zen-browser", repeat = false }
"Mod+E" = { action = "spawn footclient yazi", repeat = false }

# Shell: Noctalia panels
"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Shift+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+N" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+B" = { action = "spawn noctalia msg bar-toggle", repeat = false }
"Mod+Escape" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
# Wallpaper picker; the palette and templated app themes follow the choice
"Mod+Shift+W" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
# Alt+Tab window switcher: hold Alt and tap Tab
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
# Framework F12 (gear) key
"XF86AudioMedia" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }

# Media keys through Noctalia (shows its OSD), also when locked
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }

# Session (Noctalia also locks before suspend)
"Mod+Ctrl+Q" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }

# Screenshots (Noctalia's; noctalia.toml [shell.screenshot]), macOS numbers
# on Alt+Shift: 3 = screen, 4 = region, 5 = region then annotate
"Alt+Shift+3" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Alt+Shift+4" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Alt+Shift+5" = { action = "spawn noctalia msg screenshot-region --annotate", repeat = false }
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }

# Windows
"Mod+W" = { action = "window-close", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
# Cycle 1/3, 1/2, 2/3
"Mod+R" = "window-cycle-primary-extent"
# Cycle the workspace's layout (the companion's panel has the full picker)
"Mod+Shift+R" = { action = "workspace-set-layout toggle scrolling dwindle master stacking", repeat = false }
# Stack a window into the neighbouring column, or pop it out
"Mod+BracketLeft" = { action = "window-consume-or-expel-left", repeat = false }
"Mod+BracketRight" = { action = "window-consume-or-expel-right", repeat = false }

# Focus / move: arrows or HJKL. Up/down crosses into the next workspace.
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-or-workspace-up"
"Mod+Down" = "window-focus-or-workspace-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+Right" = "window-move-right"
"Mod+Shift+Up" = "window-move-or-workspace-up"
"Mod+Shift+Down" = "window-move-or-workspace-down"
"Mod+Shift+H" = "window-move-left"
"Mod+Shift+L" = "window-move-right"
"Mod+Shift+K" = "window-move-or-workspace-up"
"Mod+Shift+J" = "window-move-or-workspace-down"

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Tab" = { action = "workspace-focus-last", repeat = false }
"Mod+WheelUp" = "workspace-previous"
"Mod+WheelDown" = "workspace-next"
