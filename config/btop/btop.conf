#* btop: only what differs from the defaults (`btop --default-config` lists
#* them all). Not rewritten on exit: btop would dump every setting in its own
#* version's format, and macOS and Fedora run different versions.
save_config_on_exit = false

color_theme = "catppuccin-mocha.theme"
vim_keys = true
shown_boxes = "mem net proc cpu"
proc_tree = true
show_disks = false
