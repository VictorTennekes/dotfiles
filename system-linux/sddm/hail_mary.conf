# sddm-astronaut preset for the login screen (scripts/setup installs it as the
# theme's ConfigFile). Colours from config-linux/noctalia/palettes/HailMary.json
# (SDDM can't read Noctalia's palette); Departure Mono like the lock screen;
# setup copies the wallpaper (~/Pictures/Wallpapers/current) in as `background`
# and fills in Background below. Rounded corners, like the shell's panels.
[General]
ScreenWidth="1440"
ScreenHeight="960"
ScreenPadding=""
Font="DepartureMono Nerd Font"
FontSize="11"
KeyboardSize="0.4"
RoundCorners="12"
Locale=""
HourFormat="HH:mm"
DateFormat="dddd d MMMM"
HeaderText="ERID"

BackgroundPlaceholder=""
Background=""
BackgroundSpeed="1.0"
PauseBackground=""
DimBackground="0.25"
CropBackground="true"
BackgroundHorizontalAlignment="center"
BackgroundVerticalAlignment="center"

HeaderTextColor="#eaa445"
DateTextColor="#9fb4ba"
TimeTextColor="#e8dfcc"

FormBackgroundColor="#071a22"
BackgroundColor="#071a22"
DimBackgroundColor="#071a22"

LoginFieldBackgroundColor="#133745"
PasswordFieldBackgroundColor="#133745"
LoginFieldTextColor="#e8dfcc"
PasswordFieldTextColor="#e8dfcc"
UserIconColor="#eaa445"
PasswordIconColor="#eaa445"

PlaceholderTextColor="#9fb4ba"
WarningColor="#ff6e5e"

LoginButtonTextColor="#1a1206"
LoginButtonBackgroundColor="#eaa445"
SystemButtonsIconsColor="#e8dfcc"
SessionButtonTextColor="#e8dfcc"
VirtualKeyboardButtonTextColor="#e8dfcc"

DropdownTextColor="#e8dfcc"
DropdownSelectedBackgroundColor="#1a4251"
DropdownBackgroundColor="#0f2a35"

HighlightTextColor="#071a22"
HighlightBackgroundColor="#eaa445"
HighlightBorderColor="transparent"

HoverUserIconColor="#7fb3c2"
HoverPasswordIconColor="#7fb3c2"
HoverSystemButtonsIconsColor="#eaa445"
HoverSessionButtonTextColor="#eaa445"
HoverVirtualKeyboardButtonTextColor="#eaa445"

PartialBlur="true"
FullBlur=""
BlurMax="32"
Blur="1.0"
HaveFormBackground="true"
FormPosition="left"

VirtualKeyboardPosition="left"

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"
UseRealName="true"
ForceLastUser="true"
PasswordFocus="true"
HideCompletePassword="true"
AllowEmptyPassword="false"
BypassSystemButtonsChecks="false"
RightToLeftLayout="false"
